[project]
name = "nova-tools"
version = "0.1.0"
description = "Nova's project-scoped Python helpers: `from nova import edit, search`."
requires-python = ">=3.10"
dependencies = ["fff-search>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nova"]
